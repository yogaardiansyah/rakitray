name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-tauri:
    name: "Release Build (${{ matrix.platform }} / ${{ matrix.args }})"
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Mandatory LICENSE and NOTICE Files
        run: |
          test -f LICENSE
          test -f NOTICE
          grep -q "Yoga ardiansyah" LICENSE
          grep -q "Yoga ardiansyah" NOTICE
        shell: bash

      - name: Install Tauri v2 OS dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust Toolchain (Stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust Cargo Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Frontend Dependencies
        run: bun install

      - name: Build & Upload Tauri v2 Release Installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Rakitray ${{ github.ref_name }}"
          releaseBody: |
            ## Rakitray ${{ github.ref_name }}

            Ultra-fast, lightweight, modular "install-as-you-need" Local Development Environment Launcher.

            ### Downloads
            Choose the installer matching your operating system and architecture below:
            - **Windows (x64):** `.msi` or `-setup.exe` (NSIS)
            - **Linux (x64):** `.AppImage` or `.deb`
            - **macOS (Apple Silicon / Intel):** `.dmg` or `.app.tar.gz`

            ### License & Mandatory Attribution
            Licensed under **GNU AGPLv3 (`AGPL-3.0-only`)** with mandatory Section 7(b) & 5(d) attribution terms. See [`LICENSE`](https://github.com/yogaardiansyah/rakitray/blob/main/LICENSE) and [`NOTICE`](https://github.com/yogaardiansyah/rakitray/blob/main/NOTICE).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

