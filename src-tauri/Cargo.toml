[package]
name = "rakitray"
version = "0.1.0"
description = "Ultra-fast, lightweight, modular Local Development Environment Launcher"
authors = ["Yoga ardiansyah <https://github.com/yogaardiansyah>"]
license = "AGPL-3.0-only"
edition = "2021"

[lib]
name = "rakitray_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

