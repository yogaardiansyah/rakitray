[engine]
name = "mariadb"
category = "database"
version = "11.4.3"
default_port = 3306

[binaries]
daemon = "bin/mariadbd"
client = "bin/mariadb"
installer = "scripts/mariadb-install-db"

[lifecycle]
bootstrap_check_dir = "{{data_dir}}/mysql"
bootstrap_cmd = [
  "{{bin_dir}}/scripts/mariadb-install-db",
  "--no-defaults",
  "--datadir={{data_dir}}",
  "--basedir={{bin_dir}}",
  "--auth-root-authentication-method=normal",
]
start_args = [
  "--defaults-file={{config_file}}",
  "--basedir={{bin_dir}}",
  "--datadir={{data_dir}}",
  "--port={{port}}",
  "--socket={{socket_path}}",
  "--pid-file={{pid_path}}",
  "--console",
]
ready_check = { kind = "unix_socket", timeout_secs = 30 }

[config]
template = "conf/my.cnf.tpl"
output = "config/mariadb/{{instance_id}}.cnf"

[hooks]
post_start = "provision_mariadb"

