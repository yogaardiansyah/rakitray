[engine]
name = "caddy"
category = "web_server"
version = "{{version}}"
default_port = 8080

[binaries]
daemon = "caddy"

[lifecycle]
start_args = [
  "run",
  "--config",
  "{{config_file}}",
  "--adapter",
  "caddyfile",
]
ready_check = { kind = "tcp", timeout_secs = 10 }

[config]
template = "conf/Caddyfile.tpl"
output = "config/caddy/Caddyfile"

