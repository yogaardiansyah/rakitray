[engine]
name = "postgres"
category = "database"
version = "{{version}}"
default_port = 5432

[binaries]
daemon = "bin/postgres"
client = "bin/psql"
installer = "bin/initdb"

[lifecycle]
bootstrap_check_dir = "{{data_dir}}/PG_VERSION"
bootstrap_cmd = [
  "{{bin_dir}}/bin/initdb",
  "-D",
  "{{data_dir}}",
  "-U",
  "postgres",
  "-A",
  "trust",
]
start_args = [
  "-D",
  "{{data_dir}}",
  "-p",
  "{{port}}",
  "-h",
  "{{bind_address}}",
]
ready_check = { kind = "tcp", timeout_secs = 20 }

[config]
template = "conf/postgresql.conf.tpl"
output = "config/postgres/{{instance_id}}/postgresql.conf"

